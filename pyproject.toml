[project]
name = "story-creator"
version = "0.2.0"
license = "MIT"
description = "Open Notebook creator: illustrated stories from notebook sources — picture books, short stories, fables, bedtime stories, and branching adventures with one AI-painted illustration per page and cast-consistent characters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "open-notebook-creator-sdk",
    "esperanto>=2.19",
    "ai-prompter>=0.3.1",
    "langchain-core>=0.3",
    "loguru>=0.7",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.entry-points."open_notebook.creators"]
stories = "story_creator:StoryCreator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_creator"]

[tool.uv.sources]
open-notebook-creator-sdk = { git = "https://github.com/Notebooker-ai/open-notebook-creator-sdk.git", branch = "main" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
